name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'

jobs:
  windows:
    name: Windows
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        # A space in the checkout path catches unquoted paths early.
        working-directory: flint launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: flint launcher
      - name: Install Rust stable with rustfmt and Clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set stable
      - name: Configure Windows Git paths
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.autocrlf false
      - name: Format, lint, test and build
        # The runner's default TEMP is an 8.3 short path (C:\Users\RUNNER~1),
        # which canonicalizes to a different spelling than tests compare
        # against. Its own temp folder has no short names in it.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: ./scripts/ci.ps1
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-ci-logs
          path: flint launcher/target/ci/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload tested debug executable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flint-windows-debug
          path: flint launcher/target/debug/flint.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust stable with rustfmt and Clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set stable
      - name: Format, lint, test and build
        run: ./scripts/ci.ps1
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-ci-logs
          path: target/ci/
          if-no-files-found: warn
          retention-days: 14
