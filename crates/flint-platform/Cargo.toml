[package]
name = "flint-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Text only: the default features pull in an image library Flint has no
# use for; data-control is Wayland's clipboard protocol.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
flint-config = { path = "../flint-config" }

[target.'cfg(windows)'.dependencies]
global-hotkey = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
global-hotkey = { workspace = true }
libc = { workspace = true }
