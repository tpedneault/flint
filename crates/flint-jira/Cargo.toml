[package]
name = "flint-jira"
description = "Jira issues in Flint: a provider process built on Fenix's fenix-jira."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fenix-jira = { workspace = true }
flint-protocol = { path = "../flint-protocol" }
flint-provider-kit = { path = "../flint-provider-kit" }

[dev-dependencies]
flint-provider-kit = { path = "../flint-provider-kit", features = ["testing"] }
flint-host = { path = "../flint-host" }
