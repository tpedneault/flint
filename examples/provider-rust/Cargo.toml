[package]
name = "flint-example-provider"
description = "An example Flint provider in Rust: numbers in other bases."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

# Only serde_json: a provider needs nothing of Flint's.
[dependencies]
serde_json = { workspace = true }

# The test drives it through Flint's real provider host.
[dev-dependencies]
flint-host = { path = "../../crates/flint-host" }
flint-protocol = { path = "../../crates/flint-protocol" }
