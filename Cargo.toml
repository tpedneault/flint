[workspace]
resolver = "2"
members = [
    "crates/flint",
    "crates/flint-config",
    "crates/flint-fenix",
    "crates/flint-gitlab",
    "crates/flint-gui",
    "crates/flint-host",
    "crates/flint-index",
    "crates/flint-jira",
    "crates/flint-platform",
    "crates/flint-protocol",
    "crates/flint-provider-kit",
    "crates/flint-providers",
    "examples/provider-rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpedneault/flint"
authors = ["Thomas Pedneault <thomas@pedneault.dev>"]
# Flint ships as one binary; its crates are building blocks, not libraries
# on crates.io (the same choice Fenix makes).
publish = false

# Fenix's crates are not on crates.io, so they come from git, pinned to the
# revision the design was checked against (docs/DESIGN.md, "Dependencies on
# Fenix crates"). Cargo resolves an entry here only once a member uses it,
# so listing them before they are needed costs nothing and keeps the pin in
# one place. Since M8, `fenix-jira`, `fenix-gitlab` and the `fenix-forge`
# model it implements too;
# never `fenix-project`, `fenix-gui` or `fenix-picker`.
[workspace.dependencies]
fenix-control = { git = "https://github.com/tpedneault/fenix", rev = "899507281efcb3769cc7f941d1b1c00b8558b96e" }
fenix-forge = { git = "https://github.com/tpedneault/fenix", rev = "899507281efcb3769cc7f941d1b1c00b8558b96e" }
fenix-gitlab = { git = "https://github.com/tpedneault/fenix", rev = "899507281efcb3769cc7f941d1b1c00b8558b96e" }
fenix-jira = { git = "https://github.com/tpedneault/fenix", rev = "899507281efcb3769cc7f941d1b1c00b8558b96e" }
fenix-keymap = { git = "https://github.com/tpedneault/fenix", rev = "899507281efcb3769cc7f941d1b1c00b8558b96e" }
fenix-rpc = { git = "https://github.com/tpedneault/fenix", rev = "899507281efcb3769cc7f941d1b1c00b8558b96e" }
fenix-storage = { git = "https://github.com/tpedneault/fenix", rev = "899507281efcb3769cc7f941d1b1c00b8558b96e" }

# Third-party crates used by more than one member, or pinned to Fenix's
# versions on purpose: the rendering stack matches Fenix's exactly so fonts
# and colours come out the same (DESIGN.md, "Rendering").
bytemuck = { version = "1.25", features = ["derive"] }
dirs = "6"
global-hotkey = "0.8"
glyphon = "0.12"
libc = "0.2"
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
wgpu = "30.0.1"
windows-sys = "0.61"
winit = { version = "0.30.13", default-features = false }

# Every crate must say what it is for at the top, including what it
# deliberately doesn't do; the lint turns a missing header into a CI failure
# (clippy runs with `-D warnings`).
[workspace.lints.rust]
missing_docs = "warn"

[profile.release]
lto = true
codegen-units = 1
